[project]
name = "harbor-clawbench-adapter"
version = "0.1.0"
description = "Harbor adapter for ClawBench: everyday tasks on live websites, scored by request interception + LLM judge"
readme = "README.md"
authors = [
    { name = "Yuxuan Zhang", email = "mtrxcop@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "clawbench-eval>=0.9.2",
]

[project.scripts]
clawbench-adapter = "clawbench_adapter.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawbench_adapter"]
