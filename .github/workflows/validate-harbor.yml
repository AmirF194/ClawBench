name: validate-harbor

on:
  pull_request:
    branches: [main]
    paths:
      - "harbor/**"
      - "registry.json"
      - "scripts/harbor/**"
      - "src/clawbench/eval/harbor_adapter.py"
      - "src/clawbench/runtime/harbor/**"
      - "test-cases/v2/**"
      - ".github/workflows/validate-harbor.yml"
  push:
    branches: [main]
    paths:
      - "harbor/**"
      - "registry.json"
      - "scripts/harbor/**"
      - "src/clawbench/eval/harbor_adapter.py"
      - "test-cases/v2/**"
  workflow_dispatch:

jobs:
  validate-harbor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install ClawBench + Harbor
        run: |
          uv sync --frozen
          uv pip install "harbor==0.22.0"

      - name: Committed Harbor dataset is up to date
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          uv run clawbench-harbor-adapt \
            --output-dir /tmp/clawbench-v2 \
            --docker-image "ghcr.io/tiger-ai-lab/clawbench-harbor-runtime:$VERSION" \
            --overwrite
          diff -r /tmp/clawbench-v2 harbor/datasets/clawbench-v2 \
            || { echo "::error::harbor/datasets/clawbench-v2 is stale — run scripts/harbor/regenerate.sh"; exit 1; }
          uv run python scripts/harbor/build_registry.py \
            --dataset-dir harbor/datasets/clawbench-v2 --version "$VERSION" --output /tmp/registry.json
          diff /tmp/registry.json registry.json \
            || { echo "::error::registry.json is stale — run scripts/harbor/regenerate.sh"; exit 1; }

      - name: Every task loads with Harbor's TaskConfig
        run: |
          uv run python - <<'PY'
          import sys
          from pathlib import Path
          from harbor.models.task.task import Task
          root = Path("harbor/datasets/clawbench-v2")
          bad = []
          for d in sorted(p.parent for p in root.glob("*/task.toml")):
              try:
                  Task(task_dir=d).config
              except Exception as exc:  # noqa: BLE001
                  bad.append(f"{d.name}: {exc}")
          print(f"loaded {len(list(root.glob('*/task.toml'))) - len(bad)} tasks")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY

      - name: Manifest and registry agree on task names
        run: |
          uv run python - <<'PY'
          import json, tomllib, sys
          manifest = tomllib.loads(open("harbor/dataset.toml").read())
          registry = json.load(open("registry.json"))[0]
          m = {t["name"].split("/", 1)[1] for t in manifest["tasks"]}
          r = {t["name"] for t in registry["tasks"]}
          if m != r:
              print("manifest-only:", sorted(m - r)); print("registry-only:", sorted(r - m)); sys.exit(1)
          print(f"{len(m)} tasks in both harbor/dataset.toml and registry.json")
          PY
